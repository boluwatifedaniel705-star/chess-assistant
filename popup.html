<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chess Assistant</title>
  <style>
    body {
      width: 250px;
      font-family: sans-serif;
      padding: 16px;
      background: #1a1a2e;
      color: white;
    }
    h2 { font-size: 16px; margin-bottom: 12px; color: #e94560; }
    #best-move {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: #0f3460;
      color: #e2e2e2;
      margin-bottom: 12px;
    }
    #status {
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #c73652; }
  </style>
</head>
<body>
  <h2>♟ Chess Assistant</h2>
  <div id="best-move">—</div>
  <div id="status">Click Analyze to get the best move</div>
  <button onclick="analyze()">Analyze Position</button>
  <script src="popup.js"></script>
</body>
</html>
